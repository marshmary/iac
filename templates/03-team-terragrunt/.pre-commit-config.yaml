# Pre-commit hooks (https://pre-commit.com). Run `pre-commit install` once.
#
# Raw-template layers: providers/ holds pre-injection HCL with placeholder
# tokens and is deleted by init-project at instantiation time, so it is
# excluded here — that content is validated as part of root.hcl after the
# injection instead.
#
# Windows: these hooks require a POSIX shell — run pre-commit from Git Bash
# or WSL (cmd/PowerShell hosts are not supported by pre-commit).
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
        exclude: ^providers/
      - id: terraform_validate
        exclude: ^providers/
      - id: terraform_tflint
        exclude: ^providers/
      - id: checkov
        exclude: ^providers/
      - id: terraform_docs
        args:
          - --args=--output-file README.md
          - --args=--output-mode inject
        exclude: ^providers/

  # Terragrunt 1.x dropped the `hclfmt` subcommand (now `hcl fmt`); the
  # upstream terragrunt_fmt hook still invokes `hclfmt`, so this local hook
  # drives the current command directly.
  - repo: local
    hooks:
      - id: terragrunt-fmt-check
        name: Terragrunt HCL format check
        language: system
        entry: terragrunt hcl fmt --check
        pass_filenames: false
        files: \.hcl$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
