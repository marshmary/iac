# checkov configuration - IaC security scanning (https://www.checkov.io).
# Wired into: the `checkov` pre-commit hook and the catalog's run-all T1.
#
# The vendored modules under modules-local/ are scanned here; registry
# modules are pinned and validated in their own repo. Scan a registry
# checkout with: checkov -d <modules-checkout>
quiet: true
compact: true
framework:
  - terraform
# Suppressions live here, one CKV_* id per entry, ALWAYS with a documented
# reason. Do not stack skips silently.
skip-check: []
