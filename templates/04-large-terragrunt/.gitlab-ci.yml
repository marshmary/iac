# Minimal GitLab CI equivalent (opt-in — init-project --ci gitlab; the
# local-first default ships no pipeline).
#
# Runs the offline checks the project already ships. No cloud credentials
# are needed or configured here. Keep tool versions in sync with the
# version-pin files (.opentofu-version, .terragrunt-version).

check:
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl unzip
    - TOFU=1.12.0
    - TG=1.1.4
    - CONFTEST=0.55.0
    - >
      curl -fsSL
      "https://github.com/opentofu/opentofu/releases/download/v${TOFU}/tofu_${TOFU}_linux_amd64.zip"
      -o /tmp/tofu.zip
      && unzip -o /tmp/tofu.zip -d /usr/local/bin tofu
    - >
      curl -fsSL
      "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG}/terragrunt_linux_amd64"
      -o /usr/local/bin/terragrunt && chmod +x /usr/local/bin/terragrunt
    - >
      curl -fsSL
      "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST}/conftest_${CONFTEST}_Linux_x86_64.tar.gz"
      | tar -xz -C /usr/local/bin conftest
    - >
      curl -fsSL
      https://github.com/go-task/task/releases/download/v3.39.2/task_linux_amd64.tar.gz
      | tar -xz -C /usr/local/bin task
  script:
    - task check
    - task policy-verify   # policy unit tests (mocks, no plan needed)

# Weekly drift detection (runbook cadence) - wire read-only credentials via
# OIDC first (see .env.example placeholders).
drift:
  image: alpine:3.20
  before_script:
    - echo "install the same toolchain as the check job, plus cloud creds"
  script:
    - task drift PLATFORM=aws ENV=dev COMPONENT=baseline
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
