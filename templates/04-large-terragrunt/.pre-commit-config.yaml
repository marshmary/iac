# -----------------------------------------------------------------------------
# Pre-commit hooks - tier 04 live repository.
#
# WINDOWS NOTE: pre-commit requires a POSIX shell. On Windows run it from
# Git Bash (shipped with Git for Windows) or WSL; `pre-commit install` and
# `pre-commit run -a` both need that shell on PATH. CI runs the same hooks on
# Linux natively.
#
# POLICY-AS-CODE GATE (why there is no conftest hook here)
# --------------------------------------------------------
# conftest needs a rendered plan JSON, which only exists AFTER `task plan` for
# a concrete PLATFORM/ENV/COMPONENT - pre-commit has no such context. The gate
# is the task instead:
#
#     task policy-check PLATFORM=aws ENV=dev COMPONENT=baseline
#
# (see policy/README.md). CI must run that same task before any apply. This
# comment block is the wiring documentation - keep it in sync.
# -----------------------------------------------------------------------------

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      # These hooks cover the vendored modules under modules-local/ (the
      # provider-free baseline ships there; registry modules stay pinned in
      # their own repo). They apply automatically to any module you add.
      - id: terraform_fmt
      - id: terraform_tflint
      - id: terraform_docs
      - id: checkov
      # terraform_validate is intentionally OMITTED: it cannot resolve the
      # units' backend/registry wiring - `task hcl-validate` / `task check`
      # are the real validation gates here (they go through Terragrunt).

  # The workhorse: fails when any terragrunt.hcl / root.hcl / env.hcl is
  # unformatted (check-only, like tier 03 - a hook must not mutate the tree).
  # Fix formatting with `task hclfmt`. Terragrunt 1.x dropped the `hclfmt`
  # subcommand (now `hcl fmt`), so this local hook drives the current command
  # instead of the upstream hook.
  - repo: local
    hooks:
      - id: terragrunt-fmt-check
        name: Terragrunt HCL format check
        language: system
        entry: terragrunt hcl fmt --check
        pass_filenames: false
        files: \.hcl$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
