# CI skeleton (opt-in — regenerated by init-project with --ci github; the
# local-first default ships no workflows).
#
# Runs the offline checks the project already ships (Terragrunt HCL gates +
# policy unit tests). No cloud credentials are needed or configured here;
# plan/policy gates against real clouds belong to a deploy pipeline once this
# repo has one.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.0   # keep in sync with .opentofu-version

      - name: Install go-task
        run: >
          curl -fsSL https://github.com/go-task/task/releases/download/v3.39.2/task_linux_amd64.tar.gz
          | sudo tar -xz -C /usr/local/bin task

      - name: Install terragrunt
        run: >
          curl -fsSL
          https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.4/terragrunt_linux_amd64
          | sudo tee /usr/local/bin/terragrunt > /dev/null
          && sudo chmod +x /usr/local/bin/terragrunt
        # keep the version in sync with .terragrunt-version

      - name: Install conftest
        run: >
          curl -fsSL
          https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz
          | sudo tar -xz -C /usr/local/bin conftest
        # keep the version in sync with the catalog runner (tests/docker)

      - name: Offline check (hcl fmt + validate for every platform)
        run: task check

      - name: Policy unit tests (mocks, no plan needed)
        run: task policy-verify
