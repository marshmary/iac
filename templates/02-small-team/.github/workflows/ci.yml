# CI skeleton (opt-in — regenerated by init-project with --ci github; the
# local-first default ships no workflows).
#
# Runs the offline checks the project already ships (`task check` + module
# tests). No cloud credentials are needed and none are configured here.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.0   # keep in sync with .opentofu-version

      - name: Install go-task
        run: >
          curl -fsSL https://github.com/go-task/task/releases/download/v3.39.2/task_linux_amd64.tar.gz
          | sudo tar -xz -C /usr/local/bin task

      - name: Offline check (fmt, init -backend=false, validate)
        run: task check

      - name: Module tests (provider-free, fully offline)
        run: task test
