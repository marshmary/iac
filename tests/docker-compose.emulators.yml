# T6 — the floci emulator trio for full local lifecycle testing without a
# cloud account (docs/testing.md). Driven automatically by tests/t6-emulators.sh
# (IAC_T6=1 tests/run-all.sh), or manually:
#   docker compose -f tests/docker-compose.emulators.yml up -d
#   set -a; . tests/fixtures/aws-fake.env; set +a   # then export AWS_ENDPOINT_URL
#   task init-backend && task plan && task apply   # real API calls, local fake cloud
#
# Coverage: floci (AWS :4566) — S3 backend + resource applies; floci-az
# (Azure :4577) — azurerm blob backend only (no ARM resource plane);
# floci-gcp (GCP :4588) — gcs backend only (no google resource plane).
services:
  floci:
    # Version-pinned release tags, mirroring playground/compose.yml (keep the
    # two files in lockstep — same images, same pins).
    image: floci/floci:2.2.0
    container_name: iac-floci
    ports:
      - "4566:4566"          # single AWS edge endpoint; point AWS_ENDPOINT_URL here
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  floci-az:
    image: floci/floci-az:0.14.0
    container_name: iac-floci-az
    ports:
      - "4577:4577"          # blob endpoint base; containers under /devstoreaccount1
    volumes:
      - floci-az-data:/app/data

  floci-gcp:
    image: floci/floci-gcp:0.10.0
    container_name: iac-floci-gcp
    ports:
      - "4588:4588"          # GCS REST JSON/XML + gRPC
    volumes:
      - floci-gcp-data:/app/data

volumes:
  floci-data:
  floci-az-data:
  floci-gcp-data:
