# Single compose file powering the disposable playground (playground/README.md).
# One `docker compose up -d` brings up the floci emulator trio — all three
# clouds' APIs locally, no cloud account, no auth tokens (floci is MIT-licensed;
# https://floci.io). localize.sh wires the generated projects to these ports.
#
# Coverage notes (mirror playground/README.md + docs/testing.md):
#   - floci      -> AWS on :4566 (LocalStack drop-in): S3 state backend + the
#                   aws_s3_bucket starter in tiers 01/02. Point AWS_ENDPOINT_URL
#                   at localhost:4566.
#   - floci-az   -> Azure on :4577, Azurite wire-compatible (same well-known
#                   devstoreaccount1 account/key): azurerm state backend via
#                   blob. The ARM resource plane is NOT emulated, so azure
#                   starters stay offline-validate.
#   - floci-gcp  -> GCP on :4588 (GCS REST JSON/XML + gRPC): gcs state backend
#                   via STORAGE_EMULATOR_HOST. The google resource plane is NOT
#                   emulated, so gcp starters stay offline-validate.
services:
  floci:
    # Version-pinned release tags (no `latest` drift; `latest` == same digest
    # today but floats). The docker.sock mount is what floci uses to run
    # "real engine" services (Lambda/RDS/...); S3/STS/IAM work without it but
    # the mount keeps the full service set available.
    image: floci/floci:2.2.0
    container_name: iac-playground-floci
    ports:
      - "4566:4566"          # single AWS edge endpoint
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  floci-az:
    image: floci/floci-az:0.14.0
    container_name: iac-playground-floci-az
    ports:
      - "4577:4577"          # all REST services; blob at /devstoreaccount1
    volumes:
      - floci-az-data:/app/data

  floci-gcp:
    image: floci/floci-gcp:0.10.0
    container_name: iac-playground-floci-gcp
    ports:
      - "4588:4588"          # all REST + gRPC services
    volumes:
      - floci-gcp-data:/app/data

volumes:
  floci-data:
  floci-az-data:
  floci-gcp-data:
