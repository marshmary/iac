# Single compose file powering the disposable playground (playground/README.md).
# One `docker compose up -d` brings up every local emulator needed to run real
# init/plan/apply/destroy cycles against all four tiers WITHOUT a cloud account.
#
# Coverage notes (mirror docs/testing.md):
#   - localstack  -> AWS: S3 (the s3 backend with native locking) and the
#                    aws_s3_bucket starter in tiers 01/02. Point AWS_ENDPOINT_URL
#                    at localhost:4566. localize.sh wires the projects to it.
#   - azurite     -> FUTURE WORK: booted but not wired yet - nothing points
#                    Azure projects at it (localize.sh is AWS-only). Azure
#                    tiers run offline plan/validate in the playground today.
#   - gcp         -> no free emulator; offline plan/validate only.
services:
  localstack:
    # Pin the community/OSS image: the plain `latest` tag now pulls the Pro
    # edition, which exits with "License activation failed" unless a
    # LOCALSTACK_AUTH_TOKEN is set. `:4` is the OSS release line and needs none.
    image: localstack/localstack:4
    container_name: iac-playground-localstack
    environment:
      - SERVICES=s3,sts,iam
      - DEBUG=0
    ports:
      - "4566:4566"          # single AWS edge endpoint
    volumes:
      - localstack-data:/var/lib/localstack

  azurite:
    # Pinned to a stable release tag (same line MCR tags as `latest`).
    # STATUS: future work - NOTHING localizes Azure projects to this emulator
    # yet (playground/localize.sh is AWS-only), so azurite is booted but
    # unused today. Wiring it means patching azurerm backend + provider with
    # the Azurite endpoints (blob 10000) plus ARM_* fake credentials; until
    # then Azure tiers run offline plan/validate only.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    container_name: iac-playground-azurite
    ports:
      - "10000:10000"        # blob endpoint for the azurerm backend
    volumes:
      - azurite-data:/data

volumes:
  localstack-data:
  azurite-data:
